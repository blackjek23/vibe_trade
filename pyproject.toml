[project]
name = "vibe-trade"
version = "0.1.0"
description = "Python stock trading bot for Interactive Brokers"
requires-python = ">=3.11"
dependencies = [
    "ib-async>=1.0.0",
    "backtrader>=1.9.78",
    "yfinance>=0.2.40",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "typer>=0.9",
    "rich>=13.0",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21",
    "pytest-cov",
    "ruff",
    "mypy",
]
# Backtest equity-curve plotting only — not needed by the three scheduled jobs,
# kept out of the deployed Docker image.
plot = [
    "matplotlib>=3.8",
]

[project.scripts]
vibe-trade = "vibe_trade.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibe_trade"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
