services:
  submit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["submit", "--config", "/config/config.toml"]
    environment:
      - TZ=Asia/Jerusalem
    volumes:
      - vibe-data:/app/data
      - ./logs:/app/logs
      - ./config:/config:ro
    env_file: .env
    network_mode: host
    profiles: ["job"]

  record:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["record", "--config", "/config/config.toml"]
    environment:
      - TZ=Asia/Jerusalem
    volumes:
      - vibe-data:/app/data
      - ./logs:/app/logs
      - ./config:/config:ro
    env_file: .env
    network_mode: host
    profiles: ["job"]

  reconcile:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["reconcile", "--config", "/config/config.toml"]
    environment:
      - TZ=Asia/Jerusalem
    volumes:
      - vibe-data:/app/data
      - ./logs:/app/logs
      - ./config:/config:ro
    env_file: .env
    network_mode: host
    profiles: ["job"]

volumes:
  vibe-data:
