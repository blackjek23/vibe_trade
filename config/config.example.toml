[general]
mode = "paper"                    # "paper" or "live"
log_level = "INFO"
log_file = "logs/vibe_trade.log"
db_path = "data/vibe_trade.db"

[broker]
host = "127.0.0.1"
paper_port = 7497
live_port = 7496
client_id = 1
timeout = 30
account = ""                      # IB account ID, blank = first available
connect_retries = 3               # extra attempts after first failure (0-10)
retry_backoff_seconds = 2.0       # initial backoff; doubles each retry (2s, 4s, 8s...)
order_pacing_seconds = 0.05       # sleep between IB calls (qualify + place). 0 = disabled

[universe]
source = "sp500"                  # "sp500" or "custom"
custom_symbols = []               # used when source = "custom"

[scheduler]
# V2 uses OS cron for scheduling; in-process scheduler retained as a config
# section for future use but not active in V2 jobs (submit/record/reconcile).
enabled = true
interval_minutes = 60
market_open = "09:30"
market_close = "16:00"
timezone = "US/Eastern"
trading_days = ["mon", "tue", "wed", "thu", "fri"]

[risk]
# V2 sizing: each BUY = pct_per_position × net_liquidation, floor to whole shares.
# Skip signal if 1 share already exceeds the target. Skip BUY phase entirely
# at max_open_positions (exits still run).
pct_per_position = 0.018          # 1.8% of net_liq per BUY (global fallback)
max_open_positions = 50

# Multi-strategy registry (Session L). List order = priority: when more than one
# strategy signals BUY on the same un-held ticker, the first listed wins. Exits
# are strategy-scoped (a position is only exited by the strategy that opened it).
# Omit this whole section to run Donchian alone (the default).
#
# Per-strategy `pct_per_position` overrides the global risk value above; omit it
# to use the global. `params` are the strategy's tunable knobs. The crossover
# strategies use regime semantics: BUY when fast > slow, SELL when fast < slow.

[[strategies]]
id = "donchian"
enabled = true
[strategies.params]
period = 20

[[strategies]]
id = "sma"                        # SMA crossover, fast vs slow
enabled = false
[strategies.params]
fast = 20
slow = 50

[[strategies]]
id = "ema"                        # EMA crossover, fast vs slow
enabled = false
[strategies.params]
fast = 12
slow = 26

[[strategies]]
id = "macd"                       # MACD line vs signal line
enabled = false
[strategies.params]
fast = 12
slow = 26
signal = 9

[telegram]
enabled = false
token = ""                        # or set VIBE_TRADE_TELEGRAM_TOKEN env var
chat_id = ""                      # or set VIBE_TRADE_TELEGRAM_CHAT_ID env var
notify_on_trade = true
notify_on_error = true
daily_summary = true

[healthcheck]
# OPS-1 (PROJECT_EVALUATION.md): dead-man's switch, distinct from Telegram
# above. preflight pings ping_url every run (READY or NOT READY) so a total
# outage -- host down, cron/systemd itself broken, network gone entirely --
# shows up as silence on an external monitor instead of nothing at all.
# Get a ping URL from https://healthchecks.io: create a check, set its
# period to match how often preflight runs (daily) plus a grace window.
enabled = false
ping_url = ""                     # or set VIBE_TRADE_HEALTHCHECK_PING_URL env var
timeout_seconds = 10.0
