[general]
mode = "paper"                    # "paper" or "live"
log_level = "INFO"
log_file = "logs/vibe_trade.log"
db_path = "data/vibe_trade.db"

[broker]
host = "127.0.0.1"
paper_port = 7497
live_port = 7496
client_id = 1
timeout = 30
account = ""                      # IB account ID, blank = first available
connect_retries = 3               # extra attempts after first failure (0-10)
retry_backoff_seconds = 2.0       # initial backoff; doubles each retry (2s, 4s, 8s...)
order_pacing_seconds = 0.05       # sleep between IB calls (qualify + place). 0 = disabled

[universe]
source = "sp500"                  # "sp500" or "custom"
custom_symbols = []               # used when source = "custom"

[scheduler]
# V2 uses OS cron for scheduling; in-process scheduler retained as a config
# section for future use but not active in V2 jobs (submit/record/reconcile).
enabled = true
interval_minutes = 60
market_open = "09:30"
market_close = "16:00"
timezone = "US/Eastern"
trading_days = ["mon", "tue", "wed", "thu", "fri"]

# V2 first iteration: single hardcoded strategy (Donchian, N=20). When a
# second strategy lands, restore a [strategy] section here.

[risk]
# V2 sizing: each BUY = pct_per_position × net_liquidation, floor to whole shares.
# Skip signal if 1 share already exceeds the target. Skip BUY phase entirely
# at max_open_positions (exits still run).
pct_per_position = 0.018          # 1.8% of net_liq per BUY
max_open_positions = 50

[telegram]
enabled = false
token = ""                        # or set VIBE_TRADE_TELEGRAM_TOKEN env var
chat_id = ""                      # or set VIBE_TRADE_TELEGRAM_CHAT_ID env var
notify_on_trade = true
notify_on_error = true
daily_summary = true
