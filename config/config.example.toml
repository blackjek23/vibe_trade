[general]
mode = "paper"                    # "paper" or "live"
log_level = "INFO"
log_file = "logs/vibe_trade.log"
db_path = "data/vibe_trade.db"

[broker]
host = "127.0.0.1"
paper_port = 7497
live_port = 7496
client_id = 1
timeout = 30
account = ""                      # IB account ID, blank = first available
connect_retries = 3               # extra attempts after first failure (0-10)
retry_backoff_seconds = 2.0       # initial backoff; doubles each retry (2s, 4s, 8s...)
order_pacing_seconds = 0.05       # sleep between IB calls (qualify + place). 0 = disabled

[universe]
source = "sp500"                  # "sp500" or "custom"
custom_symbols = []               # used when source = "custom"

[scheduler]
enabled = true
interval_minutes = 60
market_open = "09:30"
market_close = "16:00"
timezone = "US/Eastern"
trading_days = ["mon", "tue", "wed", "thu", "fri"]

[strategy]
active = ["ma_crossover"]
timeframe = "1h"                  # "1h", "4h", "1d"
lookback_days = 60

[strategy.ma_crossover]
fast_period = 20
slow_period = 50

[strategy.rsi_mean_revert]
rsi_period = 14
oversold = 30
overbought = 70

[risk]
max_risk_per_trade_pct = 1.0
max_open_positions = 5
max_portfolio_exposure_pct = 80.0
max_single_stock_pct = 20.0

[risk.trailing_stop]
enabled = true
method = "atr"                    # "atr" or "percentage"
atr_multiplier = 1.5
atr_period = 14
percentage = 3.0

[telegram]
enabled = false
token = ""                        # or set VIBE_TRADE_TELEGRAM_TOKEN env var
chat_id = ""                      # or set VIBE_TRADE_TELEGRAM_CHAT_ID env var
notify_on_trade = true
notify_on_error = true
daily_summary = true
